<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Profile | Global Media</title>
    <link rel="stylesheet" href="styles.css">
    <script src="api.js"></script>
    <style>
        .signup-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #233D4D 0%, #FE7F2D 100%);
            padding: 1rem;
        }

        .signup-box {
            background: var(--bg-primary);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .signup-box h1 {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .signup-box p {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.18);
            background: var(--bg-primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 1rem auto;
            background: var(--gradient-1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.18);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: var(--gradient-1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.18);
            margin-top: 1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.25);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .emoji-picker {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 0.75rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-top: 0.5rem;
        }

        .emoji-btn {
            width: 2.5rem;
            height: 2.5rem;
            border: 2px solid transparent;
            background: white;
            border-radius: 8px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .emoji-btn:hover,
        .emoji-btn.selected {
            border-color: var(--primary-color);
            transform: scale(1.1);
        }

        .error-msg {
            color: #FF006E;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .success-msg {
            background: rgba(6, 214, 160, 0.1);
            border: 2px solid #06D6A0;
            color: #06D6A0;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-box">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem;">
                <div>
                    <h1>Create Profile</h1>
                    <p>Join Global Media and share your story</p>
                </div>
                <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle dark mode">🌙</button>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your name" required>
                    <div class="error-msg" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" name="username" placeholder="@username" required>
                    <div class="error-msg" id="usernameError"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email (optional, for account recovery)</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" placeholder="Create password" required>
                        <small style="display:block; color: var(--text-secondary); margin-top: 0.35rem; font-size: 0.8rem;">
                            At least 8 characters, with upper + lower case and a number.
                        </small>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password *</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobileNumber">Mobile Number for Verification *</label>
                    <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="e.g. +1 234 567 8900" required>
                </div>

                <button type="submit" class="submit-btn">Create Account ✨</button>
            </form>

            <div style="display: grid; gap: 0.75rem; margin-top: 1.25rem;">
                <button type="button" id="googleSocialBtn" class="submit-btn" style="margin-top: 0; background: #FFFFFF; color: #1DA1F2; border: 1px solid var(--border-color); box-shadow: none;">🔵 Continue with Google</button>
                <button type="button" id="githubSocialBtn" class="submit-btn" style="margin-top: 0; background: #111827; color: white; border: 1px solid var(--border-color); box-shadow: none;">🐙 Continue with GitHub</button>
            </div>

            <div class="back-link">
                <p style="margin: 0; color: var(--text-secondary); font-size: 0.9rem;">Already have a profile? 
                    <a href="index.html">Go to Home</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const googleSocialBtn = document.getElementById('googleSocialBtn');
        const githubSocialBtn = document.getElementById('githubSocialBtn');

        function socialSignup(provider) {
            const suffix = Date.now() + Math.floor(Math.random() * 1000);
            const email = `${provider}_${suffix}@social.demo`;
            const name = provider.charAt(0).toUpperCase() + provider.slice(1) + ' User';
            API.post('/api/auth/social', { provider, name, email })
                .then((data) => {
                    API.setToken(data.token);
                    API.setCurrentUser(data.user);
                    window.location.href = 'index.html';
                })
                .catch((err) => {
                    usernameError.textContent = err.message || 'Social sign-up failed';
                });
        }

        googleSocialBtn.addEventListener('click', () => { window.location.href = '/api/auth/google'; });
        githubSocialBtn.addEventListener('click', () => socialSignup('github'));

        signupForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const mobileNumber = document.getElementById('mobileNumber').value.trim();
            const nameError = document.getElementById('nameError');
            const usernameError = document.getElementById('usernameError');

            nameError.textContent = '';
            usernameError.textContent = '';

            if (!fullName) {
                nameError.textContent = 'Full name is required.';
                return;
            }
            if (!username) {
                usernameError.textContent = 'Username is required.';
                return;
            }
            if (password.length < 8) {
                usernameError.textContent = 'Password must be at least 8 characters.';
                return;
            }
            if (password !== confirmPassword) {
                usernameError.textContent = 'Passwords do not match.';
                return;
            }

            try {
                const data = await API.post('/api/auth/signup', { fullName, username, email, password, confirmPassword, mobileNumber });
                API.setToken(data.token);
                API.setCurrentUser(data.user);
                window.location.href = 'index.html';
            } catch (err) {
                usernameError.textContent = err.message || 'Could not create account';
            }
        });
    </script>
</body>
</html>
