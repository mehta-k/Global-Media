<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile | Global Media</title>
    <link rel="stylesheet" href="styles.css">
    <script src="api.js"></script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>Global Media</h1>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="reels.html" class="nav-link">Reels</a>
                <a href="messages.html" class="nav-link">Messages</a>
                <a href="user-profile.html" class="nav-link active">Profile</a>
            </div>
            <div class="user-menu">
                <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle dark mode">🌙</button>
                <div id="userAvatarNav" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #FF006E 0%, #8338EC 100%); font-size: 1.5rem; cursor: pointer; border: 2px solid var(--primary-color);">👤</div>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 1200px; grid-template-columns: 1fr;">
        <!-- Profile Header -->
        <main style="background: var(--bg-primary); border-radius: 16px; overflow: hidden;">
            <!-- Empty Profile State (when no profile exists) -->
            <div id="emptyProfileState" style="display: none; padding: 3rem; text-align: center;">
                <div style="font-size: 4rem; margin-bottom: 1.5rem;">👤</div>
                <h2>Create Your Profile</h2>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">Set up your profile to get started on Global Media</p>
                <button onclick="openCreateProfileModal()" class="btn btn-primary" style="padding: 0.75rem 2rem; font-size: 1rem;">➕ Create Profile</button>
            </div>

            <!-- Existing Profile View (when profile exists) -->
            <div id="profileView" style="display: none;">
                <!-- Cover Photo -->
                <div style="width: 100%; height: 200px; background: linear-gradient(135deg, #FF006E 0%, #8338EC 100%); position: relative;">
                    <button class="btn btn-primary" style="position: absolute; top: 1rem; right: 1rem;" onclick="openCreateProfileModal()">Edit Profile</button>
                </div>

                <!-- Profile Info -->
                <div style="padding: 1.5rem; position: relative; margin-top: -70px; margin-bottom: 1.5rem;">
                    <div style="display: flex; gap: 1.5rem; align-items: flex-start;">
                        <div id="profileAvatarLarge" style="width: 120px; height: 120px; border-radius: 50%; border: 4px solid white; background: linear-gradient(135deg, #FF006E 0%, #8338EC 100%); display: flex; align-items: center; justify-content: center; font-size: 3rem; box-shadow: 0 4px 15px rgba(255, 0, 110, 0.3);">👤</div>
                        <div style="flex: 1;">
                            <h1 id="profileName" style="font-size: 1.75rem; margin-bottom: 0;">Your Name</h1>
                            <p id="profileHandle" style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 0.75rem;">@username</p>
                            <p id="profileBio" style="margin-bottom: 1rem; line-height: 1.6;">Your bio goes here</p>
                            <div style="display: flex; gap: 1.5rem; color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1rem; flex-wrap: wrap;">
                                <span id="profileLocation">📍 Location</span>
                                <span id="profileWebsite">🔗 website.com</span>
                                <span id="profileJoinDate">📅 Joined</span>
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="openCreateProfileModal()">Edit Profile</button>
                    </div>
                </div>

                <div id="profilePosts" style="padding: 0 1.5rem 2rem;"></div>
            </div>
        </main>
    </div>

    <!-- Create/Edit Profile Modal -->
    <div id="profileModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); z-index: 1000; display: flex; align-items: center; justify-content: center; overflow-y: auto;">
        <div style="background: var(--bg-primary); border-radius: 16px; padding: 2rem; max-width: 600px; width: 90%; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); margin: 2rem auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 id="profileModalTitle" style="margin: 0;">Create Your Profile</h2>
                <button onclick="closeProfileModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">✕</button>
            </div>

            <form id="profileForm" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Full Name -->
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Full Name</label>
                    <input type="text" id="profileFullName" placeholder="e.g., John Doe" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary);" required>
                </div>

                <!-- Username -->
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Username</label>
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <span style="color: var(--text-secondary); font-weight: 600;">@</span>
                        <input type="text" id="profileUsername" placeholder="username" style="flex: 1; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary);" required>
                    </div>
                </div>

                <!-- Bio -->
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Bio</label>
                    <textarea id="profileBioInput" placeholder="Tell us about yourself..." style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); resize: vertical; min-height: 80px; font-family: inherit;"></textarea>
                </div>

                <!-- Location and Website Row -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Location</label>
                        <input type="text" id="profileLocation" placeholder="e.g., San Francisco, CA" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary);">
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Website</label>
                        <input type="url" id="profileWebsiteInput" placeholder="e.g., example.com" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary);">
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" style="flex: 1; padding: 0.75rem; background: var(--gradient-1); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: transform 0.2s;">Save Profile ✨</button>
                    <button type="button" onclick="closeProfileModal()" style="flex: 1; padding: 0.75rem; background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-weight: 600;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer style="background: linear-gradient(135deg, rgba(255, 0, 110, 0.1) 0%, rgba(131, 56, 236, 0.1) 100%); border-top: 1px solid var(--border-color); padding: 2rem; text-align: center; margin-top: 2rem; color: var(--text-secondary);">
        <p style="margin-bottom: 0.5rem; font-weight: 600;">© 2026 Global Media</p>
        <p style="margin-top: 0.5rem; font-size: 0.85rem;">Connecting people around the world 🌍</p>
    </footer>

    <style>
        .tab-btn {
            background: none;
            border: none;
            padding: 1rem 1.5rem;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
            font-size: 0.95rem;
        }

        .tab-btn:hover {
            color: var(--primary-color);
        }

        .tab-btn.active {
            color: var(--primary-color);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 4px;
            background-color: var(--primary-color);
            border-radius: 2px 2px 0 0;
        }

        .tab-content {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>

    <script>
        let viewingUsername = null;
        let isSelf = false;

        function setAvatar(emoji) {
            const large = document.getElementById('profileAvatarLarge');
            const nav = document.getElementById('userAvatarNav');
            if (large) large.textContent = emoji || '👤';
            if (nav) nav.textContent = emoji || '👤';
        }

        async function loadProfile() {
            if (!API.isLoggedIn()) {
                window.location.href = 'index.html';
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const paramUser = params.get('u');
            const me = API.getCurrentUser();
            viewingUsername = paramUser || (me && me.username);
            isSelf = !paramUser;

            if (!viewingUsername) {
                document.getElementById('emptyProfileState').style.display = 'block';
                document.getElementById('profileView').style.display = 'none';
                return;
            }

            try {
                const data = await API.get(`/api/users/${viewingUsername}`);
                const profile = data.user;
                document.getElementById('emptyProfileState').style.display = 'none';
                document.getElementById('profileView').style.display = 'block';
                document.title = `${profile.fullName} - Profile | Global Media`;
                document.getElementById('profileName').textContent = profile.fullName;
                document.getElementById('profileHandle').textContent = '@' + profile.username;
                document.getElementById('profileBio').textContent = profile.bio || 'Welcome to my profile!';
                document.getElementById('profileLocation').textContent = profile.location ? `📍 ${profile.location}` : '📍 Location not set';
                document.getElementById('profileWebsite').textContent = profile.website ? `🔗 ${profile.website}` : '🔗 No website';
                document.getElementById('profileJoinDate').textContent = `📅 Joined ${new Date(profile.joinDate).getFullYear()}`;
                setAvatar(profile.emoji);

                // Render posts
                renderProfilePosts(data.posts);

                // Followers/following counts
                const fc = document.getElementById('profileFollowers');
                if (fc) fc.textContent = `👥 ${profile.followers} followers · ${profile.following} following`;

                // Show/hide follow or edit button
                setupProfileActions(profile);
            } catch (err) {
                document.getElementById('profileView').style.display = 'none';
                document.getElementById('emptyProfileState').style.display = 'block';
            }
        }

        function renderProfilePosts(posts) {
            const box = document.getElementById('profilePosts');
            if (!box) return;
            if (!posts || !posts.length) {
                box.innerHTML = `<div style="background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:14px;padding:1.5rem;text-align:center;color:var(--text-secondary);">
                    <p style="font-size:1.2rem;margin:0 0 0.5rem;color:var(--text-primary);">No posts yet</p>
                    <p style="margin:0;">Start sharing your moments! 📸</p>
                    <a href="index.html" class="btn btn-primary" style="display:inline-block;margin-top:1rem;text-decoration:none;">Go to Feed</a>
                </div>`;
                return;
            }
            box.innerHTML = posts.map((p) => `
                <div style="background:var(--bg-primary);border:1px solid var(--border-color);border-radius:14px;padding:1.25rem;margin-bottom:1rem;">
                    <div style="display:flex;gap:0.75rem;align-items:center;margin-bottom:0.5rem;">
                        <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FF006E 0%,#8338EC 100%);display:flex;align-items:center;justify-content:center;font-size:1.2rem;">${p.author.emoji || '👤'}</div>
                        <div><strong>${p.author.fullName}</strong> <span style="color:var(--text-secondary);">@${p.author.username}</span></div>
                    </div>
                    <div style="line-height:1.5;">${escapeHtml(p.content)}</div>
                    <div style="color:var(--text-secondary);font-size:0.85rem;margin-top:0.5rem;">❤️ ${p.likes} · 💬 ${p.comments} · 🔄 ${p.retweets}</div>
                </div>`).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setupProfileActions(profile) {
            const editBtns = document.querySelectorAll('button[onclick="openCreateProfileModal()"]');
            editBtns.forEach((btn) => {
                if (isSelf) {
                    btn.style.display = '';
                    btn.textContent = 'Edit Profile';
                } else {
                    btn.style.display = 'none';
                }
            });

            let actions = document.getElementById('profileFollowActions');
            if (!actions) {
                actions = document.createElement('div');
                actions.id = 'profileFollowActions';
                const header = document.querySelector('#profileView > div:nth-child(2)');
                if (header) header.appendChild(actions);
            }
            if (isSelf) {
                actions.innerHTML = '';
                return;
            }
            const me = API.getCurrentUser();
            actions.innerHTML = `<button class="btn btn-primary" id="followBtn" style="margin-left:1rem;">${profile.isFollowing ? 'Unfollow' : 'Follow'}</button>`;
            document.getElementById('followBtn').addEventListener('click', async () => {
                try {
                    const data = await API.post(`/api/users/${profile.username}/follow`);
                    document.getElementById('followBtn').textContent = data.user.isFollowing ? 'Unfollow' : 'Follow';
                    document.getElementById('profileFollowers').textContent = `👥 ${data.user.followers} followers · ${data.user.following} following`;
                } catch (err) {
                    alert(err.message);
                }
            });
        }

        function openCreateProfileModal() {
            document.getElementById('profileModalTitle').textContent = 'Edit Your Profile';
            const me = API.getCurrentUser();
            if (me) {
                document.getElementById('profileFullName').value = me.fullName || '';
                document.getElementById('profileUsername').value = me.username || '';
                document.getElementById('profileBioInput').value = me.bio || '';
                document.getElementById('profileLocation').value = me.location || '';
                document.getElementById('profileWebsiteInput').value = me.website || '';
            }
            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeProfileModal() {
            document.getElementById('profileModal').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const profileForm = document.getElementById('profileForm');
            profileForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const payload = {
                    fullName: document.getElementById('profileFullName').value,
                    bio: document.getElementById('profileBioInput').value,
                    location: document.getElementById('profileLocation').value,
                    website: document.getElementById('profileWebsiteInput').value
                };
                try {
                    const data = await API.patch('/api/users/me', payload);
                    API.setCurrentUser(data.user);
                    alert('✨ Profile saved successfully!');
                    closeProfileModal();
                    loadProfile();
                } catch (err) {
                    alert(err.message || 'Could not save profile');
                }
            });

            const modal = document.getElementById('profileModal');
            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeProfileModal();
            });

            loadProfile();
        });

        function switchTab(event, tabName) {
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.style.display = 'none');
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            const tab = document.getElementById(tabName + '-tab');
            if (tab) tab.style.display = 'block';
            if (event && event.target) event.target.classList.add('active');
        }
    </script>
    <script src="theme.js"></script>
</body>
</html>
